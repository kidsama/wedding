<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="rRGWpm5OtQYeHAT9hPni46">

<head data-page-node-id="O3XlmpizGGaXPSLJ10pHAn">
    <meta charset="UTF-8" data-page-node-id="Y9nUV5Q5xeRzhzGfm3zBRa">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" data-page-node-id="4rKqgjUaT8Gu3vGZuCLFYV">
    <title>我们的相册</title>

    <!-- Open Graph / 微信分享卡片 meta 标签 -->
    <meta property="og:title" content="我们的相册" data-page-node-id="UhiKEQUcLf6gUr0VCJ5dW4">
    <meta property="og:description" content="每一刻都值得珍藏" data-page-node-id="7UtsV4ocJ22AG0V261OIWa">
    <meta property="og:image" content="" id="ogImage" data-page-node-id="ekL5YWeiXfRtVQvpmAo6O8">
    <meta property="og:url" content="" data-page-node-id="AArbDL0hU9Eya8yyEMCXoH">
    <meta property="og:type" content="website" data-page-node-id="nzSkwWioV9McD6AiBgjAfS">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f8f8f8;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== 头部 ========== */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 16px;
            text-align: center;
            border-bottom: 0.5px solid rgba(0, 0, 0, 0.08);
        }

        .header-title {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        /* ========== 相册网格 ========== */
        .gallery {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding: 2px;
        }

        .gallery-item {
            position: relative;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            cursor: pointer;
            background: #e8e8e8;
            -webkit-tap-highlight-color: transparent;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .gallery-item:active img {
            transform: scale(1.05);
        }

        /* 图片加载前占位 */
        .gallery-item .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #e0e0e0 0%, #f0f0f0 50%, #e8e8e8 100%);
        }

        .gallery-item .placeholder svg {
            width: 28px;
            height: 28px;
            opacity: 0.25;
        }

        /* ========== 底部信息 ========== */
        .footer {
            text-align: center;
            padding: 24px 16px 32px;
            color: #bbb;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        /* ========== 灯箱 ========== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.95);
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 95vw;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            animation: zoomIn 0.25s ease;
        }

        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .lightbox-counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes zoomIn {
            from { transform: scale(0.92); opacity: 0; }
            to   { transform: scale(1);    opacity: 1; }
        }

        /* ========== 响应式微调 ========== */
        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                gap: 3px;
                padding: 3px;
                max-width: 600px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body data-page-node-id="VErBTSmoBdfKrfQqmknYtL">

    <!-- 头部 -->
    <div class="header" data-page-node-id="zRx9GKKsjalGiGqwS70K0v">
        <div class="header-title" data-page-node-id="ax5rX7XVIn4Ft5fS35QlBc">📷 我们的相册</div>
        <div class="header-subtitle" data-page-node-id="DXqKi353xHfqThq3HSigXV">每一刻都值得珍藏</div>
    </div>

    <!-- 相册网格 -->
    <div class="gallery" id="gallery" data-page-node-id="jkKD0DnIL9KvFlVDCpB1kg"></div>

    <!-- 底部 -->
    <div class="footer" data-page-node-id="lBEDHqbZNFuHazzUkfv3hE">❤ 美好时光 · 永久珍藏 ❤</div>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox" data-page-node-id="eDubAEg2ArFCfiD3pyB7jP">
        <button class="lightbox-close" id="lightboxClose" data-page-node-id="BGtDkkJ9N4019HIv1Ysc9w">✕</button>
        <img src="" alt="" id="lightboxImg" data-page-node-id="X0uKApeweW39oenBETJ1DC">
        <div class="lightbox-counter" id="lightboxCounter" data-page-node-id="Va7ILUw4ctIPCyv01HVGFk"></div>
    </div>

    <!-- 微信 JS-SDK -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>

    <script>
        // ========== 照片数据（替换为你的真实照片URL） ==========
        const photos = [
            { url: 'https://picsum.photos/seed/1/400/400', title: '照片 1' },
            { url: 'https://picsum.photos/seed/2/400/400', title: '照片 2' },
            { url: 'https://picsum.photos/seed/3/400/400', title: '照片 3' },
            { url: 'https://picsum.photos/seed/4/400/400', title: '照片 4' },
            { url: 'https://picsum.photos/seed/5/400/400', title: '照片 5' },
            { url: 'https://picsum.photos/seed/6/400/400', title: '照片 6' },
            { url: 'https://picsum.photos/seed/7/400/400', title: '照片 7' },
            { url: 'https://picsum.photos/seed/8/400/400', title: '照片 8' },
            { url: 'https://picsum.photos/seed/9/400/400', title: '照片 9' },
            { url: 'https://picsum.photos/seed/10/400/400', title: '照片 10' },
            { url: 'https://picsum.photos/seed/11/400/400', title: '照片 11' },
            { url: 'https://picsum.photos/seed/12/400/400', title: '照片 12' },
            { url: 'https://picsum.photos/seed/13/400/400', title: '照片 13' },
            { url: 'https://picsum.photos/seed/14/400/400', title: '照片 14' },
            { url: 'https://picsum.photos/seed/15/400/400', title: '照片 15' },
            { url: 'https://picsum.photos/seed/16/400/400', title: '照片 16' },
        ];

        // ========== 微信 JS-SDK 分享配置 ==========
        (function setupWxShare() {
            var shareUrl = window.location.href.split('#')[0];
            document.getElementById('ogImage').content = photos[0].url;
            document.querySelector('meta[property="og:url"]').content = shareUrl;

            fetch('/api/wx/share', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: shareUrl })
            })
            .then(function(res) { return res.json(); })
            .then(function(res) {
                if (res.code !== 0) {
                    console.warn('JS-SDK未配置(请在云托管环境变量中设置WX_APP_ID/WX_APP_SECRET): ' + res.errorMsg);
                    return;
                }
                var cfg = res.data;
                wx.config({
                    debug: false,
                    appId: cfg.appId,
                    timestamp: cfg.timestamp,
                    nonceStr: cfg.nonceStr,
                    signature: cfg.signature,
                    jsApiList: ['updateAppMessageShareData', 'updateTimelineShareData']
                });
                wx.ready(function() {
                    var info = {
                        title: cfg.shareTitle || '我们的相册',
                        desc: cfg.shareDesc || '每一刻都值得珍藏',
                        link: shareUrl,
                        imgUrl: cfg.shareImg || photos[0].url
                    };
                    wx.updateAppMessageShareData(info);
                    wx.updateTimelineShareData({ title: info.title, link: info.link, imgUrl: info.imgUrl });
                });
                wx.error(function(err) { console.warn('wx.config失败:', err); });
            })
            .catch(function(err) { console.warn('签名请求失败:', err); });
        })();

        // ========== 渲染相册 ==========
        const gallery = document.getElementById('gallery');

        photos.forEach((photo, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <div class="placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="3"/>
                        <circle cx="8.5" cy="8.5" r="1.5"/>
                        <path d="M21 15l-5-5L5 21"/>
                    </svg>
                </div>
                <img src="${photo.url}" alt="${photo.title}" loading="lazy"
                     onload="this.previousElementSibling.style.display='none'"
                     onerror="this.previousElementSibling.style.display='flex'">
            `;
            item.addEventListener('click', () => openLightbox(index));
            gallery.appendChild(item);
        });

        // ========== 灯箱逻辑 ==========
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const lightboxCounter = document.getElementById('lightboxCounter');
        const lightboxClose = document.getElementById('lightboxClose');
        let currentIndex = 0;

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            lightboxImg.src = photos[currentIndex].url;
            lightboxCounter.textContent = `${currentIndex + 1} / ${photos.length}`;
        }

        lightboxClose.addEventListener('click', (e) => {
            e.stopPropagation();
            closeLightbox();
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // 左右滑动切换
        let touchStartX = 0;
        lightbox.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        lightbox.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(diff) > 50) {
                if (diff < 0 && currentIndex < photos.length - 1) {
                    currentIndex++;
                } else if (diff > 0 && currentIndex > 0) {
                    currentIndex--;
                }
                updateLightbox();
            }
        });

        // 键盘左右键切换（桌面端调试用）
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                currentIndex--;
                updateLightbox();
            } else if (e.key === 'ArrowRight' && currentIndex < photos.length - 1) {
                currentIndex++;
                updateLightbox();
            } else if (e.key === 'Escape') {
                closeLightbox();
            }
        });
    </script>

</body>
</html>
